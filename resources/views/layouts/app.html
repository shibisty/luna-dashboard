{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}{{.App}}{{end}}</title>
  <style>
    :root { color-scheme: light dark; --accent: #4f46e5; }
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 52rem; margin: 0 auto; padding: 1rem; }
    nav { display: flex; gap: 1rem; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid #8884; }
    nav .spacer { flex: 1; }
    nav form { display: inline; }
    a { color: var(--accent); }
    form.card { display: grid; gap: .75rem; max-width: 22rem; }
    label { display: grid; gap: .25rem; }
    input, textarea, select { font: inherit; padding: .4rem .5rem; }
    textarea { min-height: 4.5rem; }
    fieldset { display: grid; gap: .35rem; border: 1px solid #8884; padding: .6rem .8rem; }
    fieldset label { display: flex; gap: .5rem; align-items: baseline; }
    table { width: 100%; border-collapse: collapse; margin: .5rem 0 1.5rem; }
    th, td { text-align: left; padding: .45rem .4rem; border-bottom: 1px solid #8883; vertical-align: top; }
    td form { display: inline; }
    .muted { color: #888; font-size: .9rem; }
    .badge { font-size: .8rem; padding: .05rem .4rem; border: 1px solid #8886; border-radius: .3rem; }
    .secret { font: 1rem ui-monospace, monospace; padding: .75rem; border: 2px solid var(--accent); border-radius: .4rem; word-break: break-all; }
    .danger { color: #dc2626; }
    button { font: inherit; padding: .4rem .9rem; cursor: pointer; }
    .error { color: #dc2626; font-size: .9rem; }
    form.search { display: flex; gap: .5rem; align-items: center; margin: .5rem 0; }
    form.search input { flex: 1; max-width: 22rem; }
    form.inline-value { display: flex; gap: .5rem; align-items: flex-start; }
    form.inline-value textarea { flex: 1; min-height: 2.4rem; }
    label.check { display: flex; gap: .5rem; align-items: baseline; }
  </style>
</head>
<body>
  {{template "nav" .}}
  <main>{{block "content" .}}{{end}}</main>
</body>
</html>{{end}}
