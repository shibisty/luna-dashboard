{{define "layout"}}<!doctype html>
<html lang="{{.Lang.Code}}" data-theme="{{.Theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{if eq .Theme "system"}}light dark{{else}}{{.Theme}}{{end}}">
  <title>{{block "title" .}}{{.App}}{{end}}</title>
  {{template "theme" .}}
  <style>
    /* Material UI's look, written by hand: an AppBar, Paper surfaces,
       contained buttons, outlined fields. The colours are the variables
       of partials/theme.html (light, dark, or the system's). */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font: 400 1rem/1.5 var(--font); letter-spacing: .00938em; color: var(--text); background: var(--bg); }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { font: .875em/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: .1em .35em; border-radius: 4px; background: var(--code-bg); }

    /* AppBar */
    .appbar { position: sticky; top: 0; z-index: 10; background: var(--appbar); color: var(--appbar-text); box-shadow: var(--shadow-4); }
    .appbar .bar { display: flex; align-items: center; gap: 4px; max-width: 72rem; margin: 0 auto; min-height: 56px; padding: 0 16px; flex-wrap: wrap; }
    .appbar a, .appbar button { color: inherit; }
    .appbar .brand { font-size: 1.25rem; font-weight: 500; letter-spacing: .0075em; margin-right: 16px; }
    .appbar .brand:hover, .appbar .nav-link:hover { text-decoration: none; }
    .appbar .nav-link { font: 500 .875rem/1.75 var(--font); letter-spacing: .02857em; text-transform: uppercase; padding: 6px 8px; border-radius: 4px; }
    .appbar .nav-link:hover, .appbar .nav-link.active { background: rgba(255,255,255,.12); }
    .appbar .spacer { flex: 1; }
    .appbar .who { font-size: .875rem; opacity: .85; margin: 0 4px 0 8px; max-width: 18ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .appbar form { margin: 0; display: inline; }
    .appbar form button { all: unset; cursor: pointer; font: 500 .875rem/1.75 var(--font); letter-spacing: .02857em; text-transform: uppercase; padding: 6px 8px; border-radius: 4px; }
    .appbar form button:hover { background: rgba(255,255,255,.12); }
    .appbar form button:focus-visible { outline: 2px solid currentColor; }
    /* ToggleButtonGroup: the language and the theme. */
    .toggle { display: inline-flex; border: 1px solid rgba(255,255,255,.4); border-radius: 4px; overflow: hidden; margin-left: 8px; }
    .toggle a { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 30px; padding: 0 8px;
      font: 500 .75rem/1 var(--font); letter-spacing: .04em; color: inherit; opacity: .8; }
    .toggle a + a { border-left: 1px solid rgba(255,255,255,.4); }
    .toggle a:hover { background: rgba(255,255,255,.12); text-decoration: none; opacity: 1; }
    .toggle a[aria-current="true"] { background: rgba(255,255,255,.24); opacity: 1; }
    .toggle svg { width: 18px; height: 18px; fill: currentColor; }

    /* Page */
    main { max-width: 72rem; margin: 0 auto; padding: 24px 16px 64px; }
    main > p:first-child > a:first-child { font-size: .875rem; }
    h1 { font-size: 2.125rem; font-weight: 400; line-height: 1.235; letter-spacing: .00735em; margin: 8px 0 16px; overflow-wrap: anywhere; }
    h2 { font-size: 1.25rem; font-weight: 500; line-height: 1.6; letter-spacing: .0075em; margin: 32px 0 12px; }
    p { margin: 8px 0; }
    .muted { color: var(--text-2); font-size: .875rem; }
    label .muted, legend .muted { font-weight: 400; }
    .danger { color: var(--error); }
    h2.danger { color: var(--error); }

    /* Paper: cards, tables */
    form.card, form.entry, table, .paper { background: var(--paper); border-radius: 4px; box-shadow: var(--shadow-1); }
    form.card, form.entry { display: grid; gap: 16px; max-width: 30rem; padding: 24px; margin: 8px 0 16px; }
    form.entry { max-width: 44rem; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 8px 0 24px; overflow: hidden; font-size: .875rem; }
    th { font-weight: 500; color: var(--text); text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--divider); background: var(--table-head); }
    td { padding: 12px 16px; border-bottom: 1px solid var(--divider); vertical-align: top; overflow-wrap: anywhere; }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: var(--hover); }
    td form { display: inline-block; margin: 0 4px 4px 0; }
    .table-wrap { overflow-x: auto; }
    .table-wrap table { min-width: 560px; }
    td code { white-space: nowrap; }

    /* Fields: outlined */
    label { display: grid; gap: 6px; font-size: .875rem; font-weight: 500; color: var(--text-2); }
    input:not([type=checkbox]):not([type=radio]), textarea, select {
      font: 400 1rem/1.4375 var(--font); color: var(--text); background: var(--field-bg);
      padding: 8.5px 14px; border: 1px solid var(--field-border); border-radius: 4px; width: 100%; min-width: 0;
      transition: border-color .15s, box-shadow .15s; }
    input:not([type=checkbox]):not([type=radio]):hover, textarea:hover, select:hover { border-color: var(--text); }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
    input::placeholder, textarea::placeholder { color: var(--text-3); }
    textarea { min-height: 5rem; resize: vertical; }
    input[type=checkbox], input[type=radio] { accent-color: var(--primary); width: 18px; height: 18px; margin: 0; flex: none; }
    label.check, fieldset label { display: flex; gap: 10px; align-items: center; font-weight: 400; color: var(--text); font-size: 1rem; }
    fieldset { display: grid; gap: 10px; border: 1px solid var(--field-border); border-radius: 4px; padding: 12px 16px 16px; margin: 0; min-width: 0; }
    legend { padding: 0 6px; font-size: .875rem; font-weight: 500; color: var(--text-2); }
    fieldset label:has(input:not([type=checkbox]):not([type=radio])) { display: grid; gap: 6px; font-size: .875rem; font-weight: 500; color: var(--text-2); }
    span.error { color: var(--error); font-size: .75rem; font-weight: 400; letter-spacing: .03333em; }
    label:has(span.error) input, label:has(span.error) textarea, label:has(span.error) select { border-color: var(--error); }

    /* Buttons: contained; .danger in the error colour; in tables outlined. */
    button { font: 500 .875rem/1.75 var(--font); letter-spacing: .02857em; text-transform: uppercase; cursor: pointer;
      color: var(--on-primary); background: var(--primary); border: 0; border-radius: 4px; padding: 6px 16px; min-width: 64px;
      box-shadow: var(--shadow-2); transition: background .2s, box-shadow .2s; justify-self: start; }
    button:hover { background: var(--primary-dark); box-shadow: var(--shadow-4); }
    button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    button.danger { color: var(--on-error); background: var(--error); }
    button.danger:hover { background: var(--error-dark); }
    td button, form.inline-value button { padding: 3px 10px; font-size: .8125rem; box-shadow: none; color: var(--primary); background: transparent; border: 1px solid var(--primary-border); }
    td button:hover, form.inline-value button:hover { background: var(--primary-hover); box-shadow: none; }
    td button.danger { color: var(--error); border-color: var(--error-border); background: transparent; }
    td button.danger:hover { background: var(--error-hover); }

    /* Chips, alerts, the secret */
    .badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; font-size: .75rem; font-weight: 400;
      color: var(--text); border: 1px solid var(--field-border); vertical-align: 1px; white-space: nowrap; }
    p.error, .alert { color: var(--alert-error-text); background: var(--alert-error-bg); padding: 10px 16px; border-radius: 4px; font-size: .875rem; }
    .alert.info { color: var(--alert-info-text); background: var(--alert-info-bg); }
    .secret { background: var(--paper); box-shadow: var(--shadow-1); border-left: 4px solid var(--primary); border-radius: 4px; padding: 16px; word-break: break-all; }
    .secret code { background: none; font-size: 1rem; padding: 0; }

    /* The file browser */
    .usage { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; font-size: .875rem; }
    .meter { width: 12rem; height: 6px; border-radius: 3px; background: var(--divider); overflow: hidden; }
    .meter span { display: block; height: 100%; background: var(--primary); }
    .crumbs { margin: 0 0 8px; font-size: .9375rem; }
    table.files td.thumb { width: 40px; padding: 6px 0 6px 16px; }
    table.files td.thumb img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; display: block; background: var(--code-bg); }
    .icon { display: inline-block; width: 40px; height: 40px; line-height: 40px; text-align: center; color: var(--text-2); border-radius: 4px; background: var(--code-bg); }
    .icon.folder::before { content: ""; display: inline-block; width: 20px; height: 15px; vertical-align: -2px; border-radius: 2px; background: var(--primary);
      clip-path: polygon(0 0, 40% 0, 50% 18%, 100% 18%, 100% 100%, 0 100%); }
    .icon.file::before { content: ""; display: inline-block; width: 15px; height: 19px; vertical-align: -3px; border: 2px solid var(--text-3); border-radius: 2px; }
    form.drop.over { outline: 2px dashed var(--primary); outline-offset: -8px; }
    .uploads { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .875rem; }
    .uploads:empty { display: none; }
    .uploads progress { width: 8rem; vertical-align: middle; }
    .uploads li.error span:last-child { color: var(--error); }
    .preview { padding: 16px; max-width: 44rem; }
    .preview img { display: block; max-width: 100%; max-height: 60vh; margin: 0 auto; }
    h1.file-name { word-break: break-all; }
    button.link { background: none; border: 0; padding: 0; color: var(--primary); font: inherit; text-transform: none; letter-spacing: 0; min-width: 0; height: auto; box-shadow: none; }
    button.link:hover { background: none; text-decoration: underline; }
    button.link.danger { color: var(--error); }
    form.inline { display: inline; margin: 0; padding: 0; background: none; box-shadow: none; }
    td.actions { white-space: nowrap; }

    /* Forms of the lists */
    form.search { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
    form.search input { flex: 1; max-width: 26rem; }
    form.inline-value { display: flex; gap: 8px; align-items: flex-start; margin: 0; }
    form.inline-value textarea { flex: 1; min-height: 2.6rem; font-size: .875rem; }
    form.entry fieldset.list { gap: 12px; }
    form.entry fieldset.item { border-style: dashed; }
    form.entry .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 0; }

    @media (max-width: 600px) {
      h1 { font-size: 1.5rem; }
      main { padding: 16px 12px 48px; }
      form.card, form.entry { padding: 16px; }
      .appbar .who { display: none; }
      th, td { padding: 10px; }
    }
  </style>
</head>
<body>
  {{template "nav" .}}
  <main>{{block "content" .}}{{end}}</main>
</body>
</html>{{end}}
