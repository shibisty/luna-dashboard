<!doctype html>
<html lang="{{.Lang.Code}}" data-theme="{{.Theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.L.T "Pages"}} · {{.Application.Name}} · {{.App}}</title>
  {{range .Styles}}<link rel="stylesheet" href="{{.}}">
  {{end}}
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; font: 14px/1.5 var(--luna-font, Roboto, Arial, sans-serif); background: var(--luna-bg, #f5f5f5); }
    /* MUI's AppBar: primary, dense. */
    .luna-bar { display: flex; gap: 8px; align-items: center; padding: 0 12px 0 8px; height: 48px; flex: none; position: relative; z-index: 2;
      background: var(--luna-appbar, #1976d2); color: #fff; box-shadow: var(--luna-shadow-4); }
    .luna-bar a, .luna-bar button { color: #fff; text-decoration: none; background: none; border: 1px solid rgba(255,255,255,.5);
      border-radius: 4px; padding: 4px 12px; font: 500 13px/1.75 inherit; letter-spacing: .02em; text-transform: uppercase; cursor: pointer; }
    .luna-bar a.back { border: 0; text-transform: none; font-size: 14px; padding: 6px 10px; }
    .luna-bar a:hover, .luna-bar button:hover { background: rgba(255,255,255,.12); border-color: #fff; }
    .luna-bar .title { font-size: 18px; font-weight: 500; letter-spacing: .0075em; }
    .luna-bar .spacer { flex: 1; }
    .luna-bar .status { color: rgba(255,255,255,.75); font-size: 12px; max-width: 48ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .luna-bar .status.error { color: #ffcdd2; }
    .luna-bar .toggle { display: inline-flex; border: 1px solid rgba(255,255,255,.4); border-radius: 4px; overflow: hidden; }
    .luna-bar .toggle a { border: 0; border-radius: 0; display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 28px; padding: 0 6px;
      font: 500 11px/1 inherit; letter-spacing: .04em; opacity: .8; }
    .luna-bar .toggle a + a { border-left: 1px solid rgba(255,255,255,.4); }
    .luna-bar .toggle a[aria-current="true"] { background: rgba(255,255,255,.24); opacity: 1; }
    .luna-bar .toggle a:hover { opacity: 1; }
    .luna-bar .toggle svg { width: 16px; height: 16px; fill: currentColor; }
    #gjs { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <div class="luna-bar">
    <a class="back" href="/apps/{{.Application.PublicID}}">← {{.Application.Name}}</a>
    <span class="title">{{.L.T "Pages"}}</span>
    <span class="spacer"></span>
    <span class="status" id="luna-status" role="status"></span>
    <button type="button" id="luna-preview" title="{{.L.T "The page or entry as the site shows it: the published design with an entry's draft values"}}">{{.L.T "Preview"}}</button>
    <a href="/apps/{{.Application.PublicID}}/pages/entries">{{.L.T "Entry forms"}}</a>
    {{template "prefs" .}}
  </div>
  <div id="gjs"></div>

  <script type="application/json" id="luna-editor">{{.Config}}</script>
  {{range .Scripts}}<script src="{{.}}"></script>
  {{end}}
  <script>
  (function () {
    var cfg = JSON.parse(document.getElementById('luna-editor').textContent);
    var status = document.getElementById('luna-status');
    function say(text, isError) {
      status.textContent = text || '';
      status.title = text || '';
      status.classList.toggle('error', !!isError);
    }
    // Every call goes to the dashboard (same origin, the session cookie),
    // which checks the CSRF header and forwards it to luna-pages.
    var headers = function () { return { 'X-CSRF-Token': cfg.csrf }; };
    var pages = window.grapesjsPages.default;
    // The blueprint scripts of the open record, as tags at the end of the
    // published HTML. luna-pages has no files: a script the settings put
    // in a separate file goes inline.
    async function scriptsMarkup(out) {
      var sc = window.editor && window.editor.Scripts;
      if (!sc || out.kind === 'site') return;
      var e = await sc.exportPage();
      var tags = [];
      if (e.libraries) tags.push(e.libraries);
      if (e.files && e.files.length) {
        e.files.forEach(function (f) { tags.push('<script>' + String(f.code).replace(/<\/(script)/gi, '<\\/$1') + '<\/script>'); });
      } else if (e.scripts) {
        tags.push(e.scripts);
      }
      if (!tags.length) return;
      return { html: out.html + '\n' + tags.join('\n'), css: out.css };
    }
    var storage = window.grapesjsStorage;

    var editor = grapesjs.init({
      container: '#gjs',
      height: '100%',
      width: 'auto',
      storageManager: false,
      telemetry: false,
      cssIcons: cfg.icons,
      i18n: { locale: cfg.lang, detectLocale: false, messagesAdd: (window.grapesjsLocales || {}) },
      deviceManager: {
        devices: [
          { id: 'desktop', name: {{.L.T "Desktop"}}, width: '' },
          { id: 'tablet', name: {{.L.T "Tablet"}}, width: '768px', widthMedia: '992px' },
          { id: 'mobile', name: {{.L.T "Mobile"}}, width: '375px', widthMedia: '767px' }
        ]
      },
      plugins: [
        'grapesjs-preset-webpage',
        'gjs-blocks-basic',
        'grapesjs-plugin-forms',
        'grapesjs-navbar',
        'grapesjs-tabs',
        'grapesjs-component-countdown',
        'grapesjs-custom-code',
        'grapesjs-tooltip',
        'grapesjs-typed',
        'grapesjs-parser-postcss',
        'grapesjs-style-gradient',
        'grapesjs-style-bg',
        'grapesjs-style-filter',
        'grapesjs-plugin-export',
        'grapesjs-tui-image-editor',
        // Dropbox, Google Drive, OneDrive in the asset manager; each asks
        // for its app key once (kept in this browser). Box needs a token
        // server, so it is not offered.
        function (ed) {
          var ca = window.grapesjsCloudAssets;
          var back = function (path) { return location.origin + path; };
          return ca.default(ed, { providers: [
            new ca.DropboxProvider({ redirectUri: back(cfg.callbacks.dropbox) }),
            new ca.GoogleDriveProvider(),
            new ca.OneDriveProvider({ redirectUri: back(cfg.callbacks.microsoft) })
          ] });
        },
        window.grapesjsSidebarTools,
        window.grapesjsContextMenu.default,
        window.grapesjsExportJsx.default,
        // Web fonts from Google Fonts, Bunny, Fontsource, Fontshare; their
        // catalogues come through the dashboard (/editor/fonts), the fonts
        // from the CDNs. A record's fonts go into its CSS as @import.
        function (ed) { return window.grapesjsFonts.default(ed, { proxy: cfg.fonts }); },
        // Blueprints: page behaviour as node graphs, compiled to JavaScript.
        window.grapesjsScripts.default,
        // grapesjs-pages first: grapesjs-storage then leaves the templates'
        // designs to it and keeps only their fields and the entries.
        // A publish adds the record's blueprint scripts and their libraries
        // (luna-pages keeps them on sites with custom_code).
        function (ed) { return pages(ed, { remote: { url: cfg.api + '/editor', headers: headers, markup: scriptsMarkup } }); },
        function (ed) { return storage.default(ed, { rest: { url: cfg.api + '/content', headers: headers } }); }
      ],
      pluginsOpts: {
        // No jumping to the style manager on every selection: the Pages and Content panels stay open.
        // Luna's theme (luna-theme.css), not the preset's colors.
        'grapesjs-preset-webpage': { blocks: ['link-block', 'quote', 'text-basic'], showStylesOnChange: false, useCustomTheme: false },
        'gjs-blocks-basic': { flexGrid: true },
        'grapesjs-plugin-forms': { blocks: ['form', 'input', 'textarea', 'select', 'checkbox', 'radio', 'button'] },
        'grapesjs-plugin-export': { btnLabel: {{.L.T "Export ZIP"}} },
        // The image editor's files come from the dashboard, not uicdn.toast.com;
        // no usage statistics to Google Analytics, no logo from uicdn.
        'grapesjs-tui-image-editor': {
          script: cfg.tui.script,
          style: cfg.tui.style,
          config: {
            usageStatistics: false,
            includeUI: { theme: { 'common.bi.image': 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==' } }
          }
        }
      }
    });
    window.editor = editor;
    // Plugins add their CSS as they start: the theme goes after it.
    editor.onReady(function () {
      document.querySelectorAll('link[href*="luna-theme.css"]').forEach(function (l) { document.head.appendChild(l); });
      // The plugins' labels and the buttons' tooltips in the dashboard's language.
      var labels = cfg.labels || {}, bm = editor.Blocks;
      bm.getAll().forEach(function (b) { var t = labels[b.get('label')]; if (t) b.set('label', t); });
      bm.getCategories().forEach(function (c) { var t = labels[c.get('label') || c.id]; if (t) c.set('label', t); });
      bm.render();
      editor.Panels.getPanels().forEach(function (pn) {
        pn.get('buttons').forEach(function (bt) {
          var t = cfg.titles && cfg.titles[bt.id];
          if (t) bt.set('attributes', Object.assign({}, bt.get('attributes'), { title: t }));
        });
      });
    });

    // What the plugins report, in the bar.
    var words = { saving: {{.L.T "Saving…"}}, offline: {{.L.T "Offline: changes wait in this browser and go out when luna-pages is back."}},
      error: {{.L.T "Saving failed; retrying. See the console."}}, conflict: {{.L.T "Changed elsewhere: resolve the conflict in the panel."}} };
    function state(s) { if (s === 'idle') say({{.L.T "All changes saved"}}); else if (words[s]) say(words[s], s !== 'saving'); }
    editor.on('pages-manager:remote', state);
    editor.on('storage:state', state);
    editor.on('pages-manager:conflict', function () { state('conflict'); });
    // luna-pages' warnings (fields without an element, scripts a site
    // without custom code leaves out) in the bar.
    function warning(m) {
      if (/does not allow custom code/.test(m)) return {{.L.T "Scripts and stylesheet links were left out: the site does not allow custom code (custom_code in the site's settings)."}};
      var f = /^The field (.+) has no element in the template/.exec(m);
      return f ? {{.L.T "The field %s has no element in the template." "{name}"}}.replace('{name}', f[1]) : m;
    }
    editor.on('pages-manager:published', function (e) {
      var w = (e && e.warnings) || [];
      if (w.length) say({{.L.T "Published with warnings:"}} + ' ' + w.map(warning).join(' '), true);
      else say({{.L.T "Published"}});
    });

    // Preview: the open entry, else the open page (layouts and templates
    // are not pages of the site).
    document.getElementById('luna-preview').addEventListener('click', function () {
      var st = editor.ContentStorage && editor.ContentStorage.current();
      if (st) return open(st.entry.id);
      var pm = editor.PagesManager;
      var id = pm && pm.getActiveId();
      if (!id) return say({{.L.T "Open a page or an entry first."}}, true);
      pm.list().then(function (list) {
        var rec = list.filter(function (r) { return r.id === id; })[0];
        if (!rec || (rec.kind && rec.kind !== 'page')) return say({{.L.T "Layouts, templates and the site have no preview: open a page."}}, true);
        open(id);
      });
      function open(pid) { window.open(cfg.pages + '/preview?id=' + encodeURIComponent(pid), '_blank', 'noopener'); }
    });
  })();
  </script>
</body>
</html>
