{{define "title"}}{{.L.T "Log in"}} · {{.App}}{{end}}
{{define "content"}}
<h1>{{.L.T "Log in"}}</h1>
<form class="card" method="post" action="/login{{with .Redirect}}?redirect={{.}}{{end}}">
  {{.CSRFField}}
  <label>{{.L.T "Email"}}
    <input name="email" type="email" value="{{.Email}}" required autofocus autocomplete="username">
    {{with .Errors}}{{template "error" index . "email"}}{{end}}
  </label>
  <label>{{.L.T "Password"}}
    <input name="password" type="password" required autocomplete="current-password">
    {{with .Errors}}{{template "error" index . "password"}}{{end}}
  </label>
  <label class="check"><input type="checkbox" name="remember" value="1" {{if .Remember}}checked{{end}}> <span>{{.L.T "Remember me"}} <span class="muted">{{.L.T "(30 days on this device)"}}</span></span></label>
  <button>{{.L.T "Log in"}}</button>
</form>
<p>{{.L.T "No account?"}} <a href="/register">{{.L.T "Register"}}</a>.</p>
{{end}}
