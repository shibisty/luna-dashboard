{{define "title"}}Log in · {{.App}}{{end}}
{{define "content"}}
<h1>Log in</h1>
<form class="card" method="post" action="/login{{with .Redirect}}?redirect={{.}}{{end}}">
  {{.CSRFField}}
  <label>Email
    <input name="email" type="email" value="{{.Email}}" required autofocus>
    {{with .Errors}}{{template "error" index . "email"}}{{end}}
  </label>
  <label>Password
    <input name="password" type="password" required>
    {{with .Errors}}{{template "error" index . "password"}}{{end}}
  </label>
  <label class="check"><input type="checkbox" name="remember" value="1" {{if .Remember}}checked{{end}}> <span>Remember me <span class="muted">(30 days on this device)</span></span></label>
  <button>Log in</button>
</form>
<p>No account? <a href="/register">Register</a>.</p>
{{end}}
