{{define "title"}}{{.L.T "Register"}} · {{.App}}{{end}}
{{define "content"}}
<h1>{{.L.T "Register"}}</h1>
<form class="card" method="post" action="/register">
  {{.CSRFField}}
  <label>{{.L.T "Name"}}
    <input name="name" value="{{.Name}}" required autofocus autocomplete="name">
    {{with .Errors}}{{template "error" index . "name"}}{{end}}
  </label>
  <label>{{.L.T "Email"}}
    <input name="email" type="email" value="{{.Email}}" required autocomplete="username">
    {{with .Errors}}{{template "error" index . "email"}}{{end}}
  </label>
  <label>{{.L.T "Password"}}
    <input name="password" type="password" minlength="8" required autocomplete="new-password">
    {{with .Errors}}{{template "error" index . "password"}}{{end}}
  </label>
  <label>{{.L.T "Confirm password"}}
    <input name="password_confirmation" type="password" required autocomplete="new-password">
    {{with .Errors}}{{template "error" index . "password_confirmation"}}{{end}}
  </label>
  <button>{{.L.T "Register"}}</button>
</form>
<p>{{.L.T "Have an account?"}} <a href="/login">{{.L.T "Log in"}}</a>.</p>
{{end}}
